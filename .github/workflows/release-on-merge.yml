name: Release on merge

# Every merge to a golden main is a release (the operator, 2026-10-12: "the
# release cycle and cadence have to be completely programmatic and not
# depend on a seat"). A repository's own publish.yml calls this on every
# push to main:
#
#   jobs:
#     release:
#       uses: zeroemployeeorg/zeocore/.github/workflows/release-on-merge.yml@<40-hex sha>
#       permissions: {contents: write}
#       with: {project: <distribution name>, verify: <shell>}
#
# 1. plan:  the version is computed, never edited: the higher of the last v
#           tag reachable from the pushed commit and the newest version on
#           PyPI, plus one increment. The increment is the highest `bump:`
#           declared by the changelog.d fragments added since that tag
#           (patch when there are none), so the level is part of the
#           reviewed head, and a merge whose run failed still counts in the
#           next one. A fragment changed or deleted since the tag fails the
#           run, and so does a computed version PyPI already has (only a 404
#           is free). A commit that already carries a v tag is a re-run.
# 2. build: run the caller's verify, then build with the computed version
#           (hatch-vcs reads it from a local tag), and check that dist/
#           holds exactly that version's sdist and wheel.
# 3. tag:   create v<version> at the pushed commit with the workflow token.
#           The `release tags` ruleset makes tags permanent.
#
# It never publishes. PyPI's trusted publishing can't run inside a reusable
# workflow (pypa/gh-action-pypi-publish, README), so the caller's own
# top-level job uploads `dist`. Downstream steps are jobs in the caller's
# run, because events made with the workflow token start no other workflow.

on:
  workflow_call:
    inputs:
      project:
        description: "The distribution name, as dist/ file names spell it"
        required: true
        type: string
      verify:
        description: "Shell run before the build, from the repository root (the release's gate)"
        required: true
        type: string
      build:
        description: "Shell that leaves exactly one sdist and one wheel in dist/"
        required: false
        type: string
        default: "uv build"
      tag_prefix:
        description: "The tag namespace the version is counted and tagged in"
        required: false
        type: string
        default: "v"
      index:
        description: "The package index's JSON API URL, or 'none' for no package"
        required: false
        type: string
        default: "https://pypi.org/pypi"
    outputs:
      version:
        description: "The computed version"
        value: ${{ jobs.plan.outputs.version }}
      tag:
        description: "v<version>"
        value: ${{ jobs.plan.outputs.tag }}
      python-floor:
        description: "requires-python's >=X.Y floor"
        value: ${{ jobs.plan.outputs.python-floor }}

permissions:
  contents: read

jobs:
  plan:
    name: compute the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      python-floor: ${{ steps.compute.outputs.floor }}
    steps:
      - name: Check out the pushed commit, with every tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Inline, so the caller runs exactly the script at the sha it pinned.
      # It is a copy of .github/release/plan.py, which a runner outside
      # Actions (Pomar, for a private repository) runs as it stands;
      # tests/test_release_metadata.py fails if the two differ.
      # tests/test_release_metadata.py extracts and runs it.
      - name: Compute the version from tags, PyPI and the fragments since the last tag
        id: compute
        env:
          PROJECT: ${{ inputs.project }}
          INDEX: ${{ inputs.index }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          python3 - release-notes.md <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys, tomllib, urllib.error, urllib.request
          from pathlib import Path

          LEVELS = ("patch", "minor", "major")
          # TAG_PREFIX: the tag namespace ("v" for a package, "engine/v" for the engine).
          # INDEX: the index URL (PyPI's JSON API) or "none" for a repository with no
          # package on any index, which then counts from its tags alone.
          PREFIX = os.environ.get("TAG_PREFIX", "v")
          if re.fullmatch(r"(?:[a-z][a-z0-9-]*/)?v", PREFIX) is None:
              sys.exit(
                  f"::error::TAG_PREFIX {PREFIX!r} must be 'v' or '<name>/v' (lower-case name)"
              )
          NO_INDEX = os.environ["INDEX"] == "none"
          SEMVER = re.compile(re.escape(PREFIX) + r"(\d+)\.(\d+)\.(\d+)")


          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True
              ).stdout.split()


          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)


          def versions(tags):
              return sorted(tuple(map(int, m.groups())) for m in map(SEMVER.fullmatch, tags) if m)


          def text(version):
              return ".".join(map(str, version))


          def index(path):
              """(status, JSON) for INDEX/PROJECT/path; only 200 and 404 are answers."""
              url = f"{os.environ['INDEX']}/{os.environ['PROJECT']}/{path}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as answer:
                      return 200, json.load(answer)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, None
                  fail(f"{url} answered {error.code}")
              except (urllib.error.URLError, OSError, ValueError) as error:
                  fail(f"{url} could not be read: {error}")


          # The release tag at HEAD, if this is a re-run, and every reachable one.
          here = versions(git("tag", "--points-at", "HEAD", "--list", PREFIX + "*"))
          if len(here) > 1:
              fail(f"HEAD carries more than one release tag: {here}")
          earlier = [
              v
              for v in versions(git("tag", "--merged", "HEAD", "--list", PREFIX + "*"))
              if v not in here
          ]
          if not earlier and not here:
              fail("no vX.Y.Z tag is reachable from HEAD to count from")

          # Every fragment added since the last release tag, so a merge whose
          # run was cancelled or failed still counts in the next release.
          added = []
          if earlier:
              since = PREFIX + text(earlier[-1])
              status = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--name-status",
                      "--no-renames",
                      since,
                      "HEAD",
                      "--",
                      "changelog.d/",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
              for line in status:
                  code, path = line.split("\t", 1)
                  if path == "changelog.d/README.md":
                      continue
                  if code != "A":
                      fail(
                          f"{path} was changed or deleted since {since}; a fragment is added once and kept"
                      )
                  added.append(path)
          level, notes = "patch", []
          for path in sorted(added):
              first, _, body = Path(path).read_text(encoding="utf-8").partition("\n")
              found = re.fullmatch(r"bump:\s*(patch|minor|major)\s*", first)
              if found is None:
                  fail(
                      f"{path}'s first line must be 'bump: patch', 'bump: minor' or 'bump: major'"
                  )
              level = max(level, found[1], key=LEVELS.index)
              notes.append(body.strip())

          if here:
              version = here[0]
              print(f"HEAD already carries {PREFIX}{text(version)}: a re-run", file=sys.stderr)
          else:
              # Count from the higher of the last tag and the newest version
              # on the index: a version can reach PyPI without a tag (0.15.1
              # did), and a file name is never accepted twice.
              last = earlier[-1]
              published = []
              if not NO_INDEX:
                  status, project = index("json")
                  if status != 200 or not project.get("releases"):
                      fail(
                          f"{os.environ['PROJECT']} isn't on the index yet; its first upload is a separate step"
                      )
                  published = versions(PREFIX + name for name in project["releases"])
                  # A tag whose publish failed, with a merge landing before the
                  # re-run, would otherwise never reach PyPI and lose its notes.
                  if last not in published and index(f"{text(last)}/json")[0] == 404:
                      fail(
                          f"{PREFIX}{text(last)} is tagged but not on the index: re-run the Publish run "
                          f"for {PREFIX}{text(last)}'s commit, which reuses its tag, before releasing again"
                      )
              major, minor, patch = max(last, published[-1] if published else last)
              version = {
                  "major": (major + 1, 0, 0),
                  "minor": (major, minor + 1, 0),
                  "patch": (major, minor, patch + 1),
              }[level]
              if git("tag", "--list", PREFIX + text(version)):
                  fail(f"{PREFIX}{text(version)} already exists at another commit")
              # Only a 404 is free. The project answer above is the positive
              # control that the index is reachable and names this project.
              if not NO_INDEX and index(f"{text(version)}/json")[0] != 404:
                  fail(f"{text(version)} is already on the index")
          version_text = text(version)

          floor = ""  # a Python package names its floor; a repository with no pyproject has none
          if Path("pyproject.toml").exists():
              spec = tomllib.load(open("pyproject.toml", "rb"))["project"].get(
                  "requires-python", ""
              )
              found = re.fullmatch(r">=(\d+\.\d+)(\.\d+)?", spec)
              if found is None:
                  fail(f"requires-python {spec!r} has no >=X.Y floor")
              floor = found[1]

          sha = git("rev-parse", "HEAD")[0]
          body = "\n\n".join(notes) or f"A patch release of {sha}, with no changelog fragment."
          Path(sys.argv[1]).write_text(f"{body}\n", encoding="utf-8")
          print(f"{level} increment: {PREFIX}{version_text} at {sha}", file=sys.stderr)
          print(f"version={version_text}")
          print(f"floor={floor}")
          print(f"tag={PREFIX}{version_text}")
          PY

      - name: Upload the release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: verify and build
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pushed commit, with every tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag locally, so the build reads the computed version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: git tag -f "$TAG" "$GITHUB_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Verify (the caller's gate)
        run: ${{ inputs.verify }}

      - name: Build
        run: ${{ inputs.build }}

      - name: Check dist holds exactly this version's sdist and wheel
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          name="${PROJECT//-/_}"
          shopt -s nullglob
          files=(dist/*)
          expected=("dist/${name}-${VERSION}-py3-none-any.whl" "dist/${name}-${VERSION}.tar.gz")
          if [ "${#files[@]}" -ne 2 ] || [ ! -f "${expected[0]}" ] || [ ! -f "${expected[1]}" ]; then
            echo "::error::dist/ must hold exactly ${expected[*]}, found: ${files[*]}"
            exit 1
          fi
          sha256sum "${files[@]}"

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  tag:
    name: create the v tag at this commit
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Create the tag, or accept it at this same commit
        run: |
          at=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}" \
            --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .object.sha")
          if [ -z "$at" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "created ${TAG} at ${GITHUB_SHA}"
          elif [ "$at" = "$GITHUB_SHA" ]; then
            echo "${TAG} already at ${GITHUB_SHA}: a re-run"
          else
            echo "::error::${TAG} exists at ${at}, not ${GITHUB_SHA}"
            exit 1
          fi
