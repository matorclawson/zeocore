name: Publish

# Every merge to main is a release (the operator, 2026-10-12: "the release
# cycle and cadence have to be completely programmatic and not depend on a
# seat"). Nobody bumps a version, tags or approves:
#
#   1. release    (release-on-merge.yml) compute the version from the last
#                 tag, the newest version on PyPI and the changelog.d
#                 fragments added since that tag, make verify, build, then
#                 create v<version> at this commit;
#   2. publish    PyPI trusted publishing in the `pypi` environment, then a
#                 check that PyPI's files for the version are this build's;
#   3. smoke-test install the published version on its floor and run it;
#   4. github-release  the GitHub Release, from those fragments;
#   5. attest-event  GitHub's attestation of the release-event.json that
#                 was uploaded to that Release (SOW-44 rev 2, M2). It proves
#                 which workflow wrote those bytes, not that the commit was
#                 reviewed. Its failure leaves the Release in place: a
#                 consumer that finds no attestation holds.
#
# The tag comes before the publish, so a refused tag publishes nothing. A
# re-run on the same commit reuses its tag; nothing is published twice,
# because PyPI never accepts a file name again. A tag whose version never
# reached PyPI stops the next release until its own run is re-run.
#
# The `pypi` environment has no reviewer and deploys from main only, and the
# `release tags` ruleset makes v tags permanent: the operator's one-time
# setup, projects/zeocore/briefs/ZEOCORE-RELEASE-ON-MERGE-SETUP-2026-10-12.md
# in the org records. Until the gold rulesets restrict updates of main to
# the merger, anyone who can push straight to main can cut a release.
#
# PyPI's trusted publisher for zeocore: owner zeroemployeeorg, repository
# zeocore, workflow publish.yml, environment pypi. All four are in the OIDC
# token's claims and must match byte for byte, or the upload fails with
# "invalid-publisher". The publish job stays in this file because trusted
# publishing can't run inside a reusable workflow.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-on-merge.yml
    permissions:
      contents: write
    with:
      project: zeocore
      verify: |
        tools/install-pandoc.sh
        make setup
        make verify
      build: make build

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/zeocore/
    permissions:
      # id-token: write is what makes OIDC / trusted publishing work --
      # no PYPI_API_TOKEN secret needed or wanted.
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # Before the upload: under trusted publishing the publish action
      # writes dist/<file>.publish.attestation beside each file, and those
      # aren't PyPI files. tests/test_release_metadata.py runs this step and
      # the check below.
      - name: Record the built files' digests
        run: ( cd dist && sha256sum -- *.whl *.tar.gz ) | sort > built.sha256

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true
          print-hash: true
          # Only a re-run of a release already uploaded meets an existing
          # file: the plan refuses any new version the index already has.
          skip-existing: true

      - name: Check PyPI holds exactly this build's files for the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
          INDEX: https://pypi.org/pypi
        run: |
          # skip-existing would otherwise hide a same-named file with other
          # bytes. Compare every digest, with a bounded wait for the API.
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 30 "${INDEX}/zeocore/${VERSION}/json" -o release.json &&
               python3 -c "
          import json
          files = json.load(open('release.json'))['urls']
          for item in sorted(files, key=lambda f: f['filename']):
              print(item['digests']['sha256'] + '  ' + item['filename'])
          " | sort > published.sha256 && [ -s published.sha256 ]; then
              if diff -u built.sha256 published.sha256; then
                echo "PyPI holds exactly this build's files for ${VERSION}"
                exit 0
              fi
              if [ "$(wc -l < published.sha256)" -ge "$(wc -l < built.sha256)" ]; then
                echo "::error::PyPI's files for ${VERSION} are not this build's"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::PyPI didn't list ${VERSION}'s files within 5 minutes"
          exit 1

  smoke-test:
    name: smoke-test the published package
    needs: [release, publish-pypi]
    # Runs only if the publish job ran and succeeded -- `always()` plus an
    # explicit result check, since `needs` results for a skipped job read
    # as "success" by default, which would otherwise let this step silently
    # no-op instead of actually verifying anything.
    if: |
      always() && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The version THIS RUN published, from the release job's output (which
      # the build checked against the sdist and wheel file names), never
      # from "latest" -- "latest on the index" is exactly the hole that let
      # this job install and bless zeocore 0.1.0 on three separate real runs
      # (v0.5.0, v0.6.0, and the 2026-08-31 TestPyPI dispatch) while
      # believing it had verified whatever had just been published.
      EXPECTED_VERSION: ${{ needs.release.outputs.version }}
      PYTHON_FLOOR: ${{ needs.release.outputs.python-floor }}
    steps:
      - name: Check out release examples
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Fail loudly if the expected version or floor is missing
        run: |
          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "::error::the release job produced no version output -- cannot smoke-test without knowing what was published"
            exit 1
          fi
          if [ -z "${PYTHON_FLOOR}" ]; then
            echo "::error::the release job produced no python-floor output -- cannot smoke-test without knowing the published floor"
            exit 1
          fi
          echo "expecting zeocore==${EXPECTED_VERSION} on Python >=${PYTHON_FLOOR}"

      - name: Wait until the installer can resolve this version (at most 10 minutes)
        run: |
          # Ask the installer itself. 0.15.1 failed a fixed 30 s wait, and
          # 0.15.2 failed after the HTML simple page already listed its
          # files: uv reads the JSON form of the simple index, which PyPI's
          # CDN caches separately and can serve stale for longer.
          uv venv --clear --python "${PYTHON_FLOOR}" /tmp/resolve-probe
          for attempt in $(seq 1 40); do
            if uv pip install --dry-run --no-cache --python /tmp/resolve-probe/bin/python \
                 "zeocore==${EXPECTED_VERSION}" >/tmp/resolve-probe.log 2>&1; then
              echo "the installer resolves zeocore==${EXPECTED_VERSION} (attempt ${attempt})"
              exit 0
            fi
            # Only "no version of zeocore==X" is index lag worth waiting on;
            # any other resolution error (a floor or marker mismatch) is real.
            if ! grep -q "no version of zeocore==${EXPECTED_VERSION}" /tmp/resolve-probe.log; then
              cat /tmp/resolve-probe.log
              echo "::error::resolving zeocore==${EXPECTED_VERSION} failed for a reason other than index lag"
              exit 1
            fi
            sleep 15
          done
          cat /tmp/resolve-probe.log
          echo "::error::the installer couldn't resolve zeocore==${EXPECTED_VERSION} within 10 minutes"
          exit 1

      - name: Install from PyPI and smoke-test
        run: |
          # Pinned to the FLOOR, never a bare `uv venv` -- a bare venv
          # takes the runner's default interpreter (3.12 on
          # ubuntu-latest today), which is BELOW every floor zeocore has
          # ever shipped except 0.1.0's, so an unpinned interpreter lets
          # uv's resolver silently backsolve to the oldest release that
          # still satisfies 3.12 instead of failing outright. That
          # silent backsolve is the exact defect this job exists to
          # catch, so the job's own interpreter must not be capable of
          # triggering it.
          uv venv --python "${PYTHON_FLOOR}" /tmp/smoke-pypi
          # Pinned to the exact version this run published, never
          # unpinned/"latest" -- see EXPECTED_VERSION's comment above.
          uv pip install --python /tmp/smoke-pypi/bin/python --no-cache "zeocore==${EXPECTED_VERSION}"
          /tmp/smoke-pypi/bin/python -c "
          import sys
          import zeo_core
          expected = '${EXPECTED_VERSION}'
          installed = zeo_core.__version__
          print('expected version:', expected)
          print('installed version:', installed)
          if installed != expected:
              print(f'MISMATCH: this run published {expected} but the index installed {installed} -- DO NOT trust this release', file=sys.stderr)
              sys.exit(1)
          from zeo_core.tools import BaseZeoTool, ToolContext
          from zeo_core.contracts import CapabilityResult
          from zeo_core.integrations.hosted import ServiceResolver, ExecutionProfile
          from zeo_core.integrations.hubspot import HubSpotIntegration
          from zeo_core.integrations.kit import KitIntegration
          from zeo_core.integrations.gemini import ImageGenerationRequest
          from zeo_core.integrations.environments import IntegrationEnvironment
          print('import OK: authoring, native profiles, marketing, Gemini and environments')
          print('SMOKE TEST PASSED: zeocore==' + installed + ' installs and imports on the published floor')
          "
          # The zeocore command must run on this plain install, before any
          # extra: 0.15.0's crashed at start-up for want of rfc8785 and
          # requests, while the import check above passed.
          /tmp/smoke-pypi/bin/zeocore version
          uv pip install --python /tmp/smoke-pypi/bin/python --no-cache \
            --default-index https://pypi.org/simple/ "zeocore[runtime-host]==${EXPECTED_VERSION}"
          /tmp/smoke-pypi/bin/python examples/runtime_host_catalogue_v1.py
          /tmp/smoke-pypi/bin/python examples/meeting_request_v1.py
          /tmp/smoke-pypi/bin/python -c "
          import json
          import subprocess
          result = subprocess.run(['/tmp/smoke-pypi/bin/zeo-capability', 'invoke'], capture_output=True, text=True)
          assert result.returncode == 8, result
          envelope = json.loads(result.stdout)
          assert envelope['state'] == 'protocol_error', envelope
          assert envelope['error_code'] == 'ZEO_HOST_PROTOCOL', envelope
          assert envelope['binding'] is None and envelope['artifact_refs'] == [], envelope
          print('Runtime CLI refuses invocation without launch authority')
          "

  # --------------------------------------------------------------------------
  # Create the GitHub Release from this merge's changelog.d fragments.
  #
  # Without this job the workflow publishes to PyPI and leaves the repo's
  # Releases page showing the PREVIOUS version -- which is exactly what
  # happened on v0.6.0: the package was installable from PyPI while
  # /releases still read 0.5.0, because "published to the index" and
  # "announced on the repo" are two different acts and only the first was
  # automated. Nobody should have to remember the second one.
  #
  # The release page is the changelog from 0.15.2 on: its notes are the
  # fragments added since the previous tag, then GitHub's list of merged PRs
  # since it. `contents: write` is scoped to THIS job rather than raised
  # on the whole workflow, which otherwise runs read-only.
  # --------------------------------------------------------------------------
  github-release:
    name: create the GitHub Release
    needs: [release, publish-pypi, smoke-test]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Checkout first: it cleans the tree, so it would delete a download.
      - name: Check out the released commit, with its tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download this merge's release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes

      - name: Download the build the release event names
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Write the release event (version, commit, tree, notes and file digests)
        run: python3 .github/release/event.py "${TAG}" release-notes.md dist --repository "${GITHUB_REPOSITORY}" > release-event.json

      - name: Create the release, or accept it from an earlier attempt
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG}'s release already exists: a re-run"
            exit 0
          fi
          gh release create "${TAG}" release-event.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "zeocore ${TAG#v}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag

  # --------------------------------------------------------------------------
  # Attest the release event that is on the Release (zeocore-SOW-44 rev 2, M2).
  #
  # The attestation covers the bytes ACTUALLY UPLOADED: the job writes the event
  # again from this run's own build, downloads the asset from the Release, and
  # stops unless they are identical, then attests the downloaded file. The same
  # steps serve a re-run of a release that already exists. The verifier
  # (zeocore release verify-event) pins repository, this workflow's identity,
  # refs/heads/main, the push trigger and the commit; the signing identity is
  # GitHub's OIDC token for this workflow, so no key of ours is involved.
  #
  # Permissions, exactly: contents read (checkout, release download),
  # id-token write (the OIDC token for the signing certificate), attestations
  # write (to store the attestation). Nothing else.
  # --------------------------------------------------------------------------
  attest-event:
    name: attest the release event
    needs: [release, github-release]
    if: >-
      always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Checkout first: it cleans the tree, so it would delete a download.
      - name: Check out the released commit, with its tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download this merge's release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes

      - name: Download the build the release event names
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Write the release event again from this run's build
        run: |
          mkdir expected
          python3 .github/release/event.py "${TAG}" release-notes.md dist --repository "${GITHUB_REPOSITORY}" > expected/release-event.json

      - name: Download the release event that was uploaded to the Release
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern release-event.json --dir uploaded

      - name: The uploaded event is byte for byte the one this run wrote
        run: cmp expected/release-event.json uploaded/release-event.json

      - name: Attest the uploaded event
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: uploaded/release-event.json
