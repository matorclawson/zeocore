name: CI

# zeocore-SOW-40 (DECISION-local-ci-on-pomar-actions-minimal-v1, 2026-10-18).
# The full gate runs BEFORE the PR, on the seat (`make verify`, and
# `make kit-verify` for kit changes), and its summary is in the PR body. The
# PR itself runs ONE job, `smoke`: format, lint and a build, under three
# minutes, no secrets. The full Python gate (`verify`) and the kit's gate with its
# mutation rows (about 360) run on pushes to main and every night, not on pull
# requests.
#
# Contexts: `smoke` is the only context a pull request posts. The branch
# ruleset's old required contexts `zeo` and `verify-all` are replaced by
# `smoke` in the same change by zeo-rt (zeo-rt-SOW-735); no required check may
# name a job that this file no longer has.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Format check (ruff, the version uv.lock pins)
        run: uvx --from 'ruff==0.16.3' ruff format --check src tests

      - name: Lint (ruff)
        run: uvx --from 'ruff==0.16.3' ruff check src tests

      - name: Build smoke (the wheel builds)
        run: uv build --wheel --out-dir "$RUNNER_TEMP/smoke-dist"

  # The full Python gate, after a merge and every night (not on pull requests).
  verify:
    name: verify (py${{ matrix.python-version }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Pandoc for real authoring receipt tests
        # Pinned and checksummed, from GitHub's CDN, not the Ubuntu mirror.
        run: tools/install-pandoc.sh

      - name: make setup (uv sync --locked from uv.lock)
        run: make setup PYTHON_VERSION=${{ matrix.python-version }}

      - name: make verify (format-check, lint, mypy strict, arch-check, hygiene-check, hygiene-secrets, plugin-boundary, tests+coverage)
        run: make verify

  # The kit (kit/) is a Go module with its own gate, `make kit-verify`
  # (ZEOCORE-SOW-34). The Go toolchain comes from tools/install-go.sh (go.dev's
  # archive, pinned by its published sha256); kit/go.mod pins the toolchain and
  # the gate runs with GOTOOLCHAIN=local. Not a pull-request job.
  kit:
    name: kit (go1.27)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Go toolchain
        run: tools/install-go.sh

      - name: make kit-verify (gofmt, vet, race tests, mutations, offline consumer build)
        run: make kit-verify
