# zeocore's release facts, fixed per repository. No seat edits this per
# release: since release on merge, every merge to main is a release whose
# version is computed (.github/workflows/release-on-merge.yml), so nothing
# here names a version or a commit. `zeocore release pypi reconcile` and
# `verify` read a local copy that adds both, for the release they check.
pypi:
  project: zeocore
  repository: zeroemployeeorg/zeocore
  workflow: publish.yml
  environment: pypi
